<!doctype html>
<html lang="sv" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stormaktsdagar</title>
<meta name="description" content="Interaktiv karta: Sverige från rikets framväxt via Kalmarunionen till stormakt, c. 800–1721. På svenska, engelska och arabiska.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%232e5a87%22/%3E%3Cpath d=%22M8 21h16l1-9-4.5 4L16 9l-4.5 7L7 12z%22 fill=%22%23e2b64a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!--BODY-->
<div class="app">
  <header class="masthead">
    <div class="wordmark">
      <h1><span class="crowns" aria-hidden="true">♔♔♔</span><span id="app-title">Stormaktsdagar</span></h1>
      <p id="app-sub"></p>
    </div>
    <nav aria-label="Meny">
      <button class="btn-text" type="button" id="btn-glossary"></button>
      <button class="btn-text" type="button" id="btn-biblio"></button>
      <button class="btn-text" type="button" id="btn-about"></button>
      <div class="lang" role="group" aria-label="Språk / Language / اللغة">
        <button type="button" data-lang="sv" lang="sv">SV</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ar" lang="ar">عربي</button>
      </div>
    </nav>
  </header>

  <main class="map-wrap" id="map">
    <div class="yearplate">
      <div class="year" id="yp-year" aria-hidden="true"></div>
      <div class="era" id="yp-era"></div>
      <div class="union-badge" id="yp-union" hidden><span class="sw" aria-hidden="true"></span><span id="yp-union-text"></span></div>
    </div>
    <div class="map-controls">
      <button type="button" id="btn-zin"></button>
      <button type="button" id="btn-zout"></button>
      <button type="button" id="btn-home"></button>
    </div>
    <details class="legend" id="legend">
      <summary id="legend-summary"></summary>
      <div class="body" id="legend-body"></div>
    </details>
  </main>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
  <aside class="panel" id="panel" aria-live="off">
    <div class="read-tools" id="read-tools">
      <button type="button" id="btn-autoread" aria-pressed="false" hidden></button>
      <button type="button" id="btn-smaller" class="aa-small">A</button>
      <button type="button" id="btn-larger" class="aa-large">A</button>
      <button type="button" id="btn-reading" aria-pressed="false"></button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <footer class="timeline">
    <div class="transport">
      <button type="button" class="icon-btn flip" id="btn-prev"></button>
      <button type="button" class="icon-btn play" id="btn-play"></button>
      <button type="button" class="icon-btn flip" id="btn-next"></button>
      <select class="speed" id="speed" autocomplete="off">
        <option value="slow"></option>
        <option value="normal"></option>
        <option value="fast"></option>
      </select>
    </div>
    <div id="track"></div>
  </footer>
</div>
<div class="sr-only" id="live" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<!--/BODY-->
<!--SCRIPTS-->
<script src="js/projection.js"></script>
<script src="data/geo.js"></script>
<script src="data/ui.js"></script>
<script src="data/territory.js"></script>
<script src="data/places.js"></script>
<script src="data/rulers.js"></script>
<script src="data/glossary.js"></script>
<script src="data/audio.js"></script>

<script src="data/content/ch02.js"></script>

<script src="data/content/ch04.js"></script>
<script src="data/content/ch05.js"></script>
<script src="data/content/ch06.js"></script>
<script src="data/content/ch07.js"></script>
<script src="data/content/ch08.js"></script>
<script src="data/content/ch09.js"></script>
<script src="data/content/ch10.js"></script>
<script src="data/content/ch11.js"></script>
<script src="js/core.js"></script>
<script src="js/map.js"></script>
<script src="js/timeline.js"></script>
<script src="js/panel.js"></script>
<script src="js/reading.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
<!--/SCRIPTS-->
</body>
</html>
